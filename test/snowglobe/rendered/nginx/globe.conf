# Written by snowglobe render from atmo.yml; render again instead of editing.

# alpha: the PDS and every handle under snowglobe.local.snowglobe.at.
server {
    listen 443 ssl;
    server_name alpha.snowglobe.local.snowglobe.at *.snowglobe.local.snowglobe.at;
    location / {
        set $upstream http://pds-alpha:3000;
        proxy_pass $upstream;
    }
}

