# Written by snowglobe render from atmo.yml; render again instead of editing.
# The https globe "snowglobe" at snowglobe.local.snowglobe.at: alpha, regular, prod.
# Run it with snowglobe up, which renders this file first.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SG_DB_USER:-${DEVNET_DB_USER:-postgres}}
      POSTGRES_PASSWORD: ${SG_DB_PASSWORD:?snowglobe up makes it}
      POSTGRES_DB: ${SG_DB_NAME:-${DEVNET_DB_NAME:-plc}}
    networks:
      - snowglobe
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${SG_DB_USER:-${DEVNET_DB_USER:-postgres}}
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - plc-db:/var/lib/postgresql/data
  maildev:
    image: maildev/maildev:3.0.0
    restart: unless-stopped
    ports:
      - ${SG_BIND:-127.0.0.1}:${SG_MAILDEV_WEB_PORT:-1081}:1080
      - ${SG_BIND:-127.0.0.1}:${SG_MAILDEV_SMTP_PORT:-1026}:1025
    networks:
      - snowglobe
  plc:
    image: itaru2622/bluesky-did-method-plc:latest
    restart: unless-stopped
    entrypoint: |
      sh -c "
        export DB_CREDS_JSON=$$(printf '{\"username\":\"%s\",\"password\":\"%s\",\"host\":\"%s\",\"port\":\"%s\",\"database\":\"%s\"}' \"$$DEVNET_DB_USER\" \"$$DEVNET_DB_PASSWORD\" \"$$DEVNET_DB_HOST\" \"$$DEVNET_DB_PORT\" \"$$DEVNET_DB_NAME\")
        export DB_MIGRATE_CREDS_JSON=$$DB_CREDS_JSON
        exec node /app/packages/server/service/index.js
      "
    environment:
      PORT: 2582
      DEVNET_DB_USER: ${SG_DB_USER:-${DEVNET_DB_USER:-postgres}}
      DEVNET_DB_PASSWORD: ${SG_DB_PASSWORD:?snowglobe up makes it}
      DEVNET_DB_HOST: ${SG_DB_HOST:-${DEVNET_DB_HOST:-postgres}}
      DEVNET_DB_PORT: ${SG_DB_PORT:-${DEVNET_DB_PORT:-5432}}
      DEVNET_DB_NAME: ${SG_DB_NAME:-${DEVNET_DB_NAME:-plc}}
      DATABASE_URL: postgres://${SG_DB_USER:-${DEVNET_DB_USER:-postgres}}:${SG_DB_PASSWORD:?snowglobe up makes it}@${SG_DB_HOST:-${DEVNET_DB_HOST:-postgres}}:${SG_DB_PORT:-${DEVNET_DB_PORT:-5432}}/${SG_DB_NAME:-${DEVNET_DB_NAME:-plc}}
      ENABLE_MIGRATIONS: "true"
      LOG_ENABLED: "true"
      LOG_LEVEL: info
      NODE_ENV: development
    ports:
      - ${SG_BIND:-127.0.0.1}:${SG_PLC_PORT:-2582}:2582
    networks:
      - snowglobe
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:2582/_health
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
  pds-alpha:
    image: ghcr.io/bluesky-social/atproto@sha256:1cf9349e9f0e89789784569fed376cd647742ea7c368948625f44779ba03f150
    user: root
    restart: unless-stopped
    depends_on:
      plc:
        condition: service_healthy
    environment:
      PDS_PORT: "3000"
      PDS_HOSTNAME: alpha.snowglobe.local.snowglobe.at
      PDS_DATA_DIRECTORY: /pds/data
      PDS_BLOBSTORE_DISK_LOCATION: /pds/data/blocks
      PDS_DID_PLC_URL: http://plc:2582
      PDS_BSKY_APP_VIEW_URL: ${SG_APPVIEW_URL:-${DEVNET_APPVIEW_URL:-https://appview.invalid}}
      PDS_BSKY_APP_VIEW_DID: ${SG_APPVIEW_DID:-${DEVNET_APPVIEW_DID:-did:example:invalid}}
      PDS_REPORT_SERVICE_URL: ${SG_REPORT_SERVICE_URL:-${DEVNET_REPORT_SERVICE_URL:-https://moderator.invalid}}
      PDS_REPORT_SERVICE_DID: ${SG_REPORT_SERVICE_DID:-${DEVNET_REPORT_SERVICE_DID:-did:example:invalid}}
      PDS_CRAWLERS: ""
      PDS_DISABLE_SSRF_PROTECTION: "true"
      PDS_INVITE_REQUIRED: "true"
      PDS_ADMIN_PASSWORD: ${SG_PDS_ADMIN_PASSWORD:?snowglobe up makes it}
      PDS_JWT_SECRET: ${SG_PDS_JWT_SECRET:?snowglobe up makes it}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${SG_PLC_ROTATION_KEY:?snowglobe up makes it}
      PDS_EMAIL_SMTP_URL: smtp://maildev:1025
      PDS_EMAIL_FROM_ADDRESS: noreply@snowglobe.local.snowglobe.at
      PDS_HANDLE_DOMAINS: .snowglobe.local.snowglobe.at
      PDS_SERVICE_HANDLE_DOMAINS: .snowglobe.local.snowglobe.at
      LOG_ENABLED: "true"
      NODE_ENV: development
      PDS_SERVICE_DID: did:web:alpha.snowglobe.local.snowglobe.at
      PDS_LEXICON_AUTHORITY_DID: ${SG_LEXICON_AUTHORITY_DID:-}
      PDS_DEV_MODE: "false"
      NODE_EXTRA_CA_CERTS: /https/ca.crt
      SG_RESOLVE_DOMAIN: snowglobe.local.snowglobe.at
      NODE_OPTIONS: --require /https/app-names.cjs
    volumes:
      - pds-alpha-data:/pds/data
      - /state/snowglobe/ca/ca.crt:/https/ca.crt:ro
      - ./stack/https/app-names.cjs:/https/app-names.cjs:ro
    networks:
      - snowglobe
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:3000/xrpc/_health
      interval: 5s
      timeout: 3s
      retries: 10
  pds-regular:
    image: ghcr.io/bluesky-social/pds:0.4.5037
    user: root
    restart: unless-stopped
    depends_on:
      plc:
        condition: service_healthy
    environment:
      PDS_PORT: "3000"
      PDS_HOSTNAME: regular.snowglobe.local.snowglobe.at
      PDS_DATA_DIRECTORY: /pds/data
      PDS_BLOBSTORE_DISK_LOCATION: /pds/data/blocks
      PDS_DID_PLC_URL: http://plc:2582
      PDS_BSKY_APP_VIEW_URL: ${SG_APPVIEW_URL:-${DEVNET_APPVIEW_URL:-https://appview.invalid}}
      PDS_BSKY_APP_VIEW_DID: ${SG_APPVIEW_DID:-${DEVNET_APPVIEW_DID:-did:example:invalid}}
      PDS_REPORT_SERVICE_URL: ${SG_REPORT_SERVICE_URL:-${DEVNET_REPORT_SERVICE_URL:-https://moderator.invalid}}
      PDS_REPORT_SERVICE_DID: ${SG_REPORT_SERVICE_DID:-${DEVNET_REPORT_SERVICE_DID:-did:example:invalid}}
      PDS_CRAWLERS: ""
      PDS_DISABLE_SSRF_PROTECTION: "true"
      PDS_INVITE_REQUIRED: "false"
      PDS_ADMIN_PASSWORD: ${SG_PDS_ADMIN_PASSWORD:?snowglobe up makes it}
      PDS_JWT_SECRET: ${SG_PDS_JWT_SECRET:?snowglobe up makes it}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${SG_PLC_ROTATION_KEY:?snowglobe up makes it}
      PDS_EMAIL_SMTP_URL: smtp://maildev:1025
      PDS_EMAIL_FROM_ADDRESS: noreply@snowglobe.local.snowglobe.at
      PDS_HANDLE_DOMAINS: .regular.snowglobe.local.snowglobe.at
      PDS_SERVICE_HANDLE_DOMAINS: .regular.snowglobe.local.snowglobe.at
      LOG_ENABLED: "true"
      NODE_ENV: development
      PDS_SERVICE_DID: did:web:regular.snowglobe.local.snowglobe.at
      PDS_LEXICON_AUTHORITY_DID: ${SG_LEXICON_AUTHORITY_DID:-}
      PDS_DEV_MODE: "false"
      NODE_EXTRA_CA_CERTS: /https/ca.crt
      SG_RESOLVE_DOMAIN: snowglobe.local.snowglobe.at
      NODE_OPTIONS: --require /https/app-names.cjs
    volumes:
      - pds-regular-data:/pds/data
      - /state/snowglobe/ca/ca.crt:/https/ca.crt:ro
      - ./stack/https/app-names.cjs:/https/app-names.cjs:ro
    networks:
      - snowglobe
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:3000/xrpc/_health
      interval: 5s
      timeout: 3s
      retries: 10
  pds-prod:
    image: ghcr.io/bluesky-social/pds@sha256:1fa8bbceabb65d8e1710749b1ea92c1c20a7489ca38da4a0a5f64c0c10a70c29
    user: root
    restart: unless-stopped
    depends_on:
      plc:
        condition: service_healthy
    environment:
      PDS_PORT: "3000"
      PDS_HOSTNAME: prod.snowglobe.local.snowglobe.at
      PDS_DATA_DIRECTORY: /pds/data
      PDS_BLOBSTORE_DISK_LOCATION: /pds/data/blocks
      PDS_DID_PLC_URL: http://plc:2582
      PDS_BSKY_APP_VIEW_URL: ${SG_APPVIEW_URL:-${DEVNET_APPVIEW_URL:-https://appview.invalid}}
      PDS_BSKY_APP_VIEW_DID: ${SG_APPVIEW_DID:-${DEVNET_APPVIEW_DID:-did:example:invalid}}
      PDS_REPORT_SERVICE_URL: ${SG_REPORT_SERVICE_URL:-${DEVNET_REPORT_SERVICE_URL:-https://moderator.invalid}}
      PDS_REPORT_SERVICE_DID: ${SG_REPORT_SERVICE_DID:-${DEVNET_REPORT_SERVICE_DID:-did:example:invalid}}
      PDS_CRAWLERS: ""
      PDS_DISABLE_SSRF_PROTECTION: "true"
      PDS_INVITE_REQUIRED: "false"
      PDS_ADMIN_PASSWORD: ${SG_PDS_ADMIN_PASSWORD:?snowglobe up makes it}
      PDS_JWT_SECRET: ${SG_PDS_JWT_SECRET:?snowglobe up makes it}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${SG_PLC_ROTATION_KEY:?snowglobe up makes it}
      PDS_EMAIL_SMTP_URL: smtp://maildev:1025
      PDS_EMAIL_FROM_ADDRESS: noreply@snowglobe.local.snowglobe.at
      PDS_HANDLE_DOMAINS: .prod.snowglobe.local.snowglobe.at
      PDS_SERVICE_HANDLE_DOMAINS: .prod.snowglobe.local.snowglobe.at
      LOG_ENABLED: "true"
      NODE_ENV: development
      PDS_SERVICE_DID: did:web:prod.snowglobe.local.snowglobe.at
      PDS_LEXICON_AUTHORITY_DID: ${SG_LEXICON_AUTHORITY_DID:-}
      PDS_DEV_MODE: "false"
      NODE_EXTRA_CA_CERTS: /https/ca.crt
      SG_RESOLVE_DOMAIN: snowglobe.local.snowglobe.at
      NODE_OPTIONS: --require /https/app-names.cjs
    volumes:
      - pds-prod-data:/pds/data
      - /state/snowglobe/ca/ca.crt:/https/ca.crt:ro
      - ./stack/https/app-names.cjs:/https/app-names.cjs:ro
    networks:
      - snowglobe
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:3000/xrpc/_health
      interval: 5s
      timeout: 3s
      retries: 10
  relay:
    build:
      context: ./stack/relay
      args:
        INDIGO_COMMIT: ${SG_RELAY_INDIGO_COMMIT:-${DEVNET_RELAY_INDIGO_COMMIT:-b2619d864df00a66455bd9f5f0c83c1ac13ad73d}}
    image: snowglobe-relay:https-${SG_RELAY_INDIGO_COMMIT:-b2619d864df00a66455bd9f5f0c83c1ac13ad73d}
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      RELAY_ADMIN_PASSWORD: ${SG_RELAY_ADMIN_PASSWORD:?snowglobe up makes it}
      RELAY_PLC_HOST: http://plc:2582
      RELAY_ALLOW_PRIVATE_HOSTS: "true"
      RELAY_LENIENT_SYNC_VALIDATION: "true"
      ENVIRONMENT: dev
    volumes:
      - relay-data:/data/relay
      - /state/snowglobe/ca/ca.crt:/etc/ssl/certs/snowglobe-ca.pem:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:2470/xrpc/_health
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - snowglobe
  relay-init:
    image: alpine:3.20
    depends_on:
      relay:
        condition: service_healthy
      nginx:
        condition: service_healthy
      pds-alpha:
        condition: service_healthy
      pds-regular:
        condition: service_healthy
      pds-prod:
        condition: service_healthy
    environment:
      RELAY_ADMIN_PASSWORD: ${SG_RELAY_ADMIN_PASSWORD:?snowglobe up makes it}
      RELAY_HOSTS: alpha.snowglobe.local.snowglobe.at regular.snowglobe.local.snowglobe.at prod.snowglobe.local.snowglobe.at
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        apk add --no-cache curl >/dev/null 2>&1
        for host in $$RELAY_HOSTS; do
          echo "[relay-init] crawl $$host"
          curl -sf -u "admin:$$RELAY_ADMIN_PASSWORD" -H "Content-Type: application/json" \
            -d "{\"hostname\": \"$$host\"}" http://relay:2470/admin/pds/requestCrawl
          echo
        done
    networks:
      - snowglobe
    restart: "no"
  jetstream:
    build: ./stack/jetstream
    image: snowglobe-jetstream:915424b082cd
    restart: unless-stopped
    environment:
      JETSTREAM_RELAY_URL: http://relay:2470
      JETSTREAM_PLC_URL: http://plc:2582
      JETSTREAM_DATA_DIR: /data/v2
      JETSTREAM_ADDR: :6008
      JETSTREAM_DEBUG_ADDR: :6009
    volumes:
      - jetstream-data:/data
      - /state/snowglobe/ca/ca.crt:/etc/ssl/certs/snowglobe-ca.pem:ro
    ports:
      - ${SG_BIND:-127.0.0.1}:${SG_JETSTREAM_PORT:-6008}:6008
      - ${SG_BIND:-127.0.0.1}:${SG_JETSTREAM_METRICS_PORT:-6009}:6009
    networks:
      - snowglobe
    healthcheck:
      test:
        - CMD
        - /busybox
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:6008/xrpc/network.bsky.jetstream.listSegments?limit=1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 120s
    depends_on:
      relay:
        condition: service_healthy
  init:
    image: alpine:3.20
    depends_on:
      pds-alpha:
        condition: service_healthy
      plc:
        condition: service_healthy
    volumes:
      - ./stack/init:/scripts:ro
      - /state/snowglobe/snowglobe:/devnet-data
    environment:
      PDS_HOSTNAME: alpha.snowglobe.local.snowglobe.at
      PDS_ADMIN_PASSWORD: ${SG_PDS_ADMIN_PASSWORD:?snowglobe up makes it}
      HANDLE_DOMAIN: .snowglobe.local.snowglobe.at
      SEED_ACCOUNTS: ${SG_SEED_ACCOUNTS:-${DEVNET_SEED_ACCOUNTS:-true}}
      SG_DOMAIN: snowglobe.local.snowglobe.at
    entrypoint: /bin/sh
    command:
      - -c
      - sed "s#http://pds:3000#http://pds-alpha:3000#" /scripts/init.sh > /tmp/init.sh && sh /tmp/init.sh
    networks:
      - snowglobe
    restart: "no"
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    depends_on:
      plc:
        condition: service_healthy
      pds-alpha:
        condition: service_healthy
      pds-regular:
        condition: service_healthy
      pds-prod:
        condition: service_healthy
    ports:
      - ${SG_BIND:-127.0.0.1}:443:443
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      SG_DOMAIN: snowglobe.local.snowglobe.at
      NGINX_ENVSUBST_FILTER: ^SG_
    volumes:
      - ./stack/https/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /state/snowglobe/snowglobe/https/leaf.crt:/etc/nginx/https/leaf.crt:ro
      - /state/snowglobe/snowglobe/https/leaf.key:/etc/nginx/https/leaf.key:ro
      - /state/snowglobe/snowglobe/https/nginx:/etc/nginx/snowglobe:ro
      - /state/snowglobe/snowglobe/globe/nginx:/etc/nginx/globe:ro
      - ./stack/page/index.html:/srv/page/index.html:ro
      - ./stack/page/fonts:/srv/page/fonts:ro
      - ./stack/page/snowglobe.conf:/etc/nginx/page/snowglobe.conf:ro
    networks:
      snowglobe:
        aliases:
          - alpha.snowglobe.local.snowglobe.at
          - regular.snowglobe.local.snowglobe.at
          - prod.snowglobe.local.snowglobe.at
    healthcheck:
      test:
        - CMD
        - nginx
        - -t
        - -q
      interval: 5s
      timeout: 3s
      retries: 10
  slingshot-dns:
    build: ./stack/https/dns
    image: snowglobe-dns:6fb1e99ad6c9
    restart: unless-stopped
    environment:
      SG_DOMAIN: snowglobe.local.snowglobe.at
    dns:
      - 127.0.0.1
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - snowglobe
  slingshot:
    build:
      context: ./stack/slingshot
      args:
        MICROCOSM_COMMIT: ${SG_SLINGSHOT_COMMIT:-3137b07d5268812d2de0f3177664be92196994d8}
    image: snowglobe-slingshot:${SG_SLINGSHOT_COMMIT:-3137b07d5268812d2de0f3177664be92196994d8}
    restart: unless-stopped
    network_mode: service:slingshot-dns
    depends_on:
      slingshot-dns:
        condition: service_started
      plc:
        condition: service_healthy
      jetstream:
        condition: service_healthy
    environment:
      SLINGSHOT_PLC_DIRECTORY: http://plc:2582
      SLINGSHOT_JETSTREAM: ws://jetstream:6008/subscribe
      SLINGSHOT_CACHE_DIR: /data
      SLINGSHOT_BIND: 0.0.0.0:8080
      SSL_CERT_FILE: /https/ca.crt
    volumes:
      - /state/snowglobe/ca/ca.crt:/https/ca.crt:ro
      - slingshot-data:/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'echo > /dev/tcp/127.0.0.1/8080'
      interval: 5s
      timeout: 3s
      retries: 10
  proxy:
    build: ./stack/https/proxy
    image: snowglobe-proxy:5eefb13d6284
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      PROXY_DOMAIN: snowglobe.local.snowglobe.at
      PROXY_UPSTREAM: nginx:443
    ports:
      - ${SG_BIND:-127.0.0.1}:${SG_PROXY_PORT:-1080}:1080
    networks:
      - snowglobe
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:1080/_health
      interval: 5s
      timeout: 3s
      retries: 10
  pdsls:
    build: ./stack/pdsls
    image: snowglobe-pdsls:12c414a749ef
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      PDSLS_PUBLIC_URL: https://pdsls.snowglobe.local.snowglobe.at
      PDSLS_DOMAIN: snowglobe.local.snowglobe.at
      PDSLS_PLC_URL: https://plc.snowglobe.local.snowglobe.at
      PDSLS_JETSTREAM_URL: wss://jetstream.snowglobe.local.snowglobe.at/subscribe
      PDSLS_FIREHOSE_URL: wss://relay.snowglobe.local.snowglobe.at
      PDSLS_LEXICON_AUTHORITY: ${SG_LEXICON_AUTHORITY_DID:-}
      PDSLS_UPSTREAM: nginx:443
      NODE_EXTRA_CA_CERTS: /https/ca.crt
    volumes:
      - /state/snowglobe/ca/ca.crt:/https/ca.crt:ro
    networks:
      - snowglobe
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/_health
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  plc-db:
  pds-alpha-data:
  pds-regular-data:
  pds-prod-data:
  relay-data:
  jetstream-data:
  slingshot-data:
networks:
  snowglobe:
