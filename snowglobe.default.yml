# The default snowglobe: one current PDS, a PLC directory and Jetstream, all at https names, with
# Slingshot and PDSls (the record browser) beside them.
# Copy this file to snowglobe.yml (here, or in your app's repo) and run snowglobe up
# (bin/snowglobe.mjs up from a checkout of snowglobe). The commented sections below add more.
# What each one does:
#   https://github.com/OpenMeet-Team/snowglobe/blob/main/docs/snowglobe.md
# The whole thing, three PDSes, a relay and a lexicon authority:
#   https://github.com/OpenMeet-Team/snowglobe/blob/main/docs/examples/atmo.yml

globe: snowglobe
domain: local.snowglobe.at     # every name below is under it

pds:
  - name: main                 # https://main.local.snowglobe.at
    image: ghcr.io/bluesky-social/pds:0.4.5037    # a current release
    bare_handles: true         # its handles are <account>.local.snowglobe.at
  # A second PDS, with handles <name>.other.local.snowglobe.at. The relay crawls it too, so
  # Jetstream sees its writes.
  # - name: other
  #   image: ghcr.io/bluesky-social/pds:0.4.5009
  #
  # The permissioned-spaces alpha. Invites are required, and it is the PDS to name as the
  # lexicon authority below. Its short name is pinned by digest.
  # - name: alpha
  #   image: spaces-alpha
  #   invites: required

services:                      # these are the defaults, each true or false
  jetstream: true
  slingshot: true              # answers a handle's DID and PDS inside the network; needs jetstream
  pdsls: true                  # https://pdsls.local.snowglobe.at, a browser for the network's records
  tap: false                   # sends an app the events of one collection (true, or a map; see snowglobe.md above)
  # relay: auto                # auto: on with Jetstream, which reads it, or more than one PDS

# Where every PDS resolves lexicons (NSIDs) from. Name a PDS that is in this file.
# lexicons:
#   authority: alpha
#   publish: lexicons          # a folder next to this file; up publishes every lexicon in it

# A group host runs beside the PDSes, at https://gh.local.snowglobe.at.
# grouphosts:
#   - name: gh
#     kind: opensocial
#     build: ../atproto-group-host   # a folder with a Dockerfile, from this file's folder

accounts:                      # <name>@<pds>; up makes each one
  - alice@main
  - bob@main

# Your app, reached at https://myapp.app.local.snowglobe.at, with settings from the snowglobe.
# `snowglobe env` hands them over. The names:
#   https://github.com/OpenMeet-Team/snowglobe/blob/main/docs/your-app.md
# apps:
