# Postgres and MailDev, which the PLC server and the PDS's email verification need. Read by
# lib/render.mjs; not meant to be run directly (see docker-compose.yml).

services:
  postgres:
    image: postgres:16-alpine
    # PLC restarts on its own (unless-stopped) but needs this; without it a
    # Docker restart leaves postgres down and PLC crash-looping on DNS.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SG_DB_USER:-${DEVNET_DB_USER:-postgres}}
      POSTGRES_PASSWORD: ${SG_DB_PASSWORD:?snowglobe up makes it}
      POSTGRES_DB: ${SG_DB_NAME:-${DEVNET_DB_NAME:-plc}}
    ports:
      - "${SG_POSTGRES_PORT:-${DEVNET_POSTGRES_PORT:-5433}}:5432"
    networks:
      - atproto-devnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SG_DB_USER:-${DEVNET_DB_USER:-postgres}}"]
      interval: 3s
      timeout: 3s
      retries: 10

  maildev:
    # Pinned: 3.0.0 moved the health check to /api/healthz (stack/page/snowglobe.conf asks there).
    image: maildev/maildev:3.0.0
    restart: unless-stopped
    ports:
      - "${SG_MAILDEV_WEB_PORT:-${DEVNET_MAILDEV_WEB_PORT:-1081}}:1080"
      - "${SG_MAILDEV_SMTP_PORT:-${DEVNET_MAILDEV_SMTP_PORT:-1026}}:1025"
    networks:
      - atproto-devnet

  # Override PLC/PDS to depend on test postgres/maildev
  plc:
    depends_on:
      postgres:
        condition: service_healthy

  pds:
    environment:
      PDS_EMAIL_SMTP_URL: smtp://maildev:1025
