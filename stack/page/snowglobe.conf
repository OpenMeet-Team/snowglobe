# The local snowglobe's page relays: included in the server for the bare
# SG_DOMAIN in https/nginx.conf.template, where root and snowglobe.json are set. Each relay is a fixed
# path to one service in the compose network, GET only. A variable upstream is looked up through
# Docker's DNS on each request, so a service that starts after nginx, or is recreated, is still found.
# The relays to each account server are rendered from snowglobe.yml (bin/snowglobe.mjs render) into
# the globe's nginx/page.inc, included below.

proxy_connect_timeout 3s;
proxy_read_timeout 5s;
# These replace the http block's headers here, so the feed's websocket ones are repeated.
proxy_set_header Host $proxy_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
if ($request_method !~ ^(GET|HEAD)$) { return 405; }

set $plc http://plc:2582;
set $jetstream http://jetstream:6008;
set $slingshot http://slingshot-dns:8080;
set $maildev http://maildev:1080;
set $pdsls http://pdsls:8080;
set $relay http://relay:2470;
set $tap http://tap:2480;

location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}
location = /snowglobe.json {
    default_type application/json;
    add_header Cache-Control "no-cache";
    alias /etc/nginx/snowglobe/snowglobe.json;
}

# Health: each service's own check, or its front page where it has none.
location = /health/plc       { proxy_pass $plc/_health; }
location = /health/relay     { proxy_pass $relay/xrpc/_health; }
location = /health/jetstream { proxy_pass $jetstream/; }
location = /health/slingshot { proxy_pass $slingshot/; }
location = /health/sync      { proxy_pass $tap/health; }
location = /health/mail      { proxy_pass $maildev/api/healthz; }
location = /health/pdsls     { proxy_pass $pdsls/_health; }

# Health and accounts for each account server (/health/<name>, /people/<name>/listRepos and
# describeRepo; /health/pds and /people/ are the PDS with bare handles, else the first). The query
# string passes through.
include /etc/nginx/globe/page.inc;

# The live feed: Jetstream's websocket, open as long as the page is.
location = /subscribe {
    proxy_read_timeout 1h;
    proxy_pass $jetstream/subscribe$is_args$args;
}

# The page's fonts (stack/page/fonts/), served with it so the page loads nothing from another site.
location ^~ /fonts/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
}
location / { return 404; }
