# The service definitions snowglobe starts from (lib/render.mjs reads this file and
# docker-compose.test.yml and docker-compose.relay.yml, and writes the compose file a snowglobe
# runs). Not meant to be run directly: its paths are relative to the repository root, so use
# `bin/snowglobe.mjs up`.
#
# Needs from the rendered file: PostgreSQL (for the PLC server) and an SMTP server (for the
# PDS's email verification), which docker-compose.test.yml supplies.

services:
  # ── DID Registry ─────────────────────────────────────────────────
  plc:
    image: itaru2622/bluesky-did-method-plc:latest
    restart: unless-stopped
    # PLC needs DB_CREDS_JSON as a JSON string, which can't be built from
    # env var interpolation in compose. We wrap the entrypoint to construct
    # it at runtime from the same credential vars used everywhere else. The container's own
    # DEVNET_DB_* keep their names, though the settings are SG_DB_*: a project's overlay may set
    # them on this service (openmeet-api's docker-compose-devnet.yml does).
    entrypoint: >
      sh -c "
        export DB_CREDS_JSON=$$(printf '{\"username\":\"%s\",\"password\":\"%s\",\"host\":\"%s\",\"port\":\"%s\",\"database\":\"%s\"}' \"$$DEVNET_DB_USER\" \"$$DEVNET_DB_PASSWORD\" \"$$DEVNET_DB_HOST\" \"$$DEVNET_DB_PORT\" \"$$DEVNET_DB_NAME\")
        export DB_MIGRATE_CREDS_JSON=$$DB_CREDS_JSON
        exec node /app/packages/server/service/index.js
      "
    environment:
      PORT: 2582
      DEVNET_DB_USER: ${SG_DB_USER:-${DEVNET_DB_USER:-postgres}}
      DEVNET_DB_PASSWORD: ${SG_DB_PASSWORD:?snowglobe up makes it}
      DEVNET_DB_HOST: ${SG_DB_HOST:-${DEVNET_DB_HOST:-postgres}}
      DEVNET_DB_PORT: ${SG_DB_PORT:-${DEVNET_DB_PORT:-5432}}
      DEVNET_DB_NAME: ${SG_DB_NAME:-${DEVNET_DB_NAME:-plc}}
      DATABASE_URL: "postgres://${SG_DB_USER:-${DEVNET_DB_USER:-postgres}}:${SG_DB_PASSWORD:?snowglobe up makes it}@${SG_DB_HOST:-${DEVNET_DB_HOST:-postgres}}:${SG_DB_PORT:-${DEVNET_DB_PORT:-5432}}/${SG_DB_NAME:-${DEVNET_DB_NAME:-plc}}"
      ENABLE_MIGRATIONS: "true"
      LOG_ENABLED: "true"
      LOG_LEVEL: info
      NODE_ENV: development
    ports:
      - "${SG_PLC_PORT:-${DEVNET_PLC_PORT:-2582}}:2582"
    networks:
      - atproto-devnet
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2582/_health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Personal Data Server ─────────────────────────────────────────
  pds:
    # Any PDS build: a release (ghcr.io/bluesky-social/pds:<version>) or an
    # upstream commit (ghcr.io/bluesky-social/atproto:pds-<commit sha>).
    image: ${SG_PDS_IMAGE:-${DEVNET_PDS_IMAGE:-ghcr.io/bluesky-social/pds:0.4}}
    # Release images run as root; monorepo images run as `node`, which cannot
    # open the root-owned pds-data volume.
    user: root
    restart: unless-stopped
    depends_on:
      plc:
        condition: service_healthy
    environment:
      PDS_PORT: 3000
      PDS_HOSTNAME: ${SG_PDS_HOSTNAME:-${DEVNET_PDS_HOSTNAME:-devnet.test}}
      PDS_DATA_DIRECTORY: /pds/data
      PDS_BLOBSTORE_DISK_LOCATION: /pds/data/blocks
      PDS_DID_PLC_URL: http://plc:2582
      # The PDS forwards app.bsky.* reads, and any XRPC method it does not implement
      # (com.atproto.space.* on a build without spaces, for one), to this AppView with
      # a service-auth token for the caller. The default host does not resolve, so
      # nothing on this network reaches Bluesky's production AppView. Point it at a
      # real AppView only if your app needs reads proxied through the PDS; Bluesky's
      # AppView never sees devnet accounts, since no relay outside devnet crawls them.
      PDS_BSKY_APP_VIEW_URL: ${SG_APPVIEW_URL:-${DEVNET_APPVIEW_URL:-https://appview.invalid}}
      PDS_BSKY_APP_VIEW_DID: ${SG_APPVIEW_DID:-${DEVNET_APPVIEW_DID:-did:example:invalid}}
      PDS_REPORT_SERVICE_URL: ${SG_REPORT_SERVICE_URL:-${DEVNET_REPORT_SERVICE_URL:-https://moderator.invalid}}
      PDS_REPORT_SERVICE_DID: ${SG_REPORT_SERVICE_DID:-${DEVNET_REPORT_SERVICE_DID:-did:example:invalid}}
      PDS_CRAWLERS: ""
      # PDS builds after upstream 1ff43e6e5 (2026-09-10) resolve DIDs through the
      # SSRF-protected fetch, which refuses the local PLC's http:// URL.
      PDS_DISABLE_SSRF_PROTECTION: "true"
      PDS_INVITE_REQUIRED: "true"
      PDS_ADMIN_PASSWORD: ${SG_PDS_ADMIN_PASSWORD:?snowglobe up makes it}
      PDS_JWT_SECRET: ${SG_PDS_JWT_SECRET:?snowglobe up makes it}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${SG_PLC_ROTATION_KEY:?snowglobe up makes it}
      PDS_EMAIL_SMTP_URL: ${SG_SMTP_URL:-${DEVNET_SMTP_URL:-smtp://maildev:1025}}
      PDS_EMAIL_FROM_ADDRESS: noreply@devnet.test
      PDS_HANDLE_DOMAINS: ${SG_HANDLE_DOMAIN:-${DEVNET_HANDLE_DOMAIN:-.devnet.test}}
      PDS_SERVICE_HANDLE_DOMAINS: ${SG_HANDLE_DOMAIN:-${DEVNET_HANDLE_DOMAIN:-.devnet.test}}
      LOG_ENABLED: "true"
      NODE_ENV: development
    volumes:
      - pds-data:/pds/data
    ports:
      - "${SG_PDS_PORT:-${DEVNET_PDS_PORT:-3000}}:3000"
    networks:
      - atproto-devnet
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/xrpc/_health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Jetstream (JSON event stream from the relay's firehose) ──────
  # Built from stack/jetstream: the pinned Jetstream, plus busybox for the health check. It reads
  # a relay, not a PDS: at start it asks the relay for the network's hosts, which a PDS refuses.
  jetstream:
    build: ./jetstream
    image: snowglobe-jetstream
    restart: unless-stopped
    environment:
      JETSTREAM_RELAY_URL: http://relay:2470
      JETSTREAM_PLC_URL: http://plc:2582
      # A folder of its own: a volume from an older snowglobe holds the older Jetstream's files.
      JETSTREAM_DATA_DIR: /data/v2
      JETSTREAM_ADDR: ":6008"
      # Metrics, at /metrics.
      JETSTREAM_DEBUG_ADDR: ":6009"
    volumes:
      - jetstream-data:/data
    ports:
      - "${SG_JETSTREAM_PORT:-${DEVNET_JETSTREAM_PORT:-6008}}:6008"
      - "${SG_JETSTREAM_METRICS_PORT:-${DEVNET_JETSTREAM_METRICS_PORT:-6009}}:6009"
    networks:
      - atproto-devnet
    # Healthy once it serves: its archive answers 503 until then, as its streams do. The debug
    # port's /readyz says only that it is listening.
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:6008/xrpc/network.bsky.jetstream.listSegments?limit=1"]
      interval: 5s
      timeout: 3s
      retries: 10
      # A new snowglobe's first start takes a minute or two (docs/how-it-works.md).
      start_period: 120s

  # ── TAP (repo sync + backfill) ───────────────────────────────────
  tap:
    # Pinned by digest (indigo revision 4f47add4, built 2026-03-11): the one the Statusphere flow was run against.
    image: ghcr.io/bluesky-social/indigo/tap@sha256:5e20bfe416d29fcd215ed8bf99f10b2ab825a6de4e5599846dd33967ade2abeb
    restart: unless-stopped
    depends_on:
      pds:
        condition: service_healthy
    environment:
      TAP_RELAY_URL: http://pds:3000
      TAP_PLC_URL: http://plc:2582
      TAP_DATABASE_URL: sqlite:///data/tap.db
      TAP_DISABLE_ACKS: "true"
      TAP_LOG_LEVEL: info
    volumes:
      - tap-data:/data
    ports:
      - "${SG_TAP_PORT:-${DEVNET_TAP_PORT:-2480}}:2480"
    networks:
      - atproto-devnet
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2480/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Init (one-shot setup) ────────────────────────────────────────
  init:
    image: alpine:3.20
    depends_on:
      pds:
        condition: service_healthy
      plc:
        condition: service_healthy
    volumes:
      - ./stack/init:/scripts:ro
      - ./data:/devnet-data
    environment:
      PDS_HOSTNAME: ${SG_PDS_HOSTNAME:-${DEVNET_PDS_HOSTNAME:-devnet.test}}
      PDS_ADMIN_PASSWORD: ${SG_PDS_ADMIN_PASSWORD:?snowglobe up makes it}
      HANDLE_DOMAIN: ${SG_HANDLE_DOMAIN:-${DEVNET_HANDLE_DOMAIN:-.devnet.test}}
      SEED_ACCOUNTS: ${SG_SEED_ACCOUNTS:-${DEVNET_SEED_ACCOUNTS:-true}}
    entrypoint: /bin/sh
    command: ["/scripts/init.sh"]
    networks:
      - atproto-devnet
    restart: "no"

volumes:
  pds-data:
  jetstream-data:
  tap-data:

networks:
  atproto-devnet:
